version: "3.9"

services:
  # ── App ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: crown-registry:latest
    container_name: crown-registry-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://crown:${POSTGRES_PASSWORD}@postgres:5432/crown_registry
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - crown-network
    volumes:
      - app-uploads:/app/public/uploads

  # ── PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: crown-registry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crown_registry
      POSTGRES_USER: crown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crown -d crown_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crown-network

  # ── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: crown-registry-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crown-network

  # ── Elasticsearch ─────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: crown-registry-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crown-network

  # ── Nginx reverse proxy ───────────────────────
  nginx:
    image: nginx:alpine
    container_name: crown-registry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - crown-network

  # ── Adminer (dev only) ────────────────────────
  adminer:
    image: adminer
    container_name: crown-registry-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    profiles:
      - dev
    networks:
      - crown-network

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  app-uploads:
  certbot-webroot:

networks:
  crown-network:
    driver: bridge
